url: https://katsevich-lab.github.io/simulatr/

authors:
  "Timothy Barry":
    href: https://timothy-barry.github.io/
  "Eugene Katsevich":
    href: https://ekatsevi.github.io/

development:
  mode: auto

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]

articles:
  - title: User guide
    navbar: ~
    contents:
      - getting-started
      - writing-a-method
      - running-on-a-cluster
      - reproducibility-and-seeding
      - reading-your-memory-profile

reference:
  - title: Components and study
    contents:
      - simulatr_model
      - simulatr_method
      - simulatr_metric
      - simulatr_study
      - add_ground_truth
  - title: Verbs
    contents:
      - simulatr_generate
      - simulatr_run
      - simulatr_evaluate
      - simulatr_evals_summarise
      - simulatr_check
  - title: Built-in metrics
    contents:
      - matches("^metric_")
      - matches("^(fdp|power|fwe)$")
  - title: Benchmarking and reproducibility
    contents:
      - simulatr_benchmark
      - simulatr_session_info
      - contract
  - title: Parameter grid helpers
    contents:
      - get_param_from_study
      - create_param_grid_two_way_factorial
      - create_param_grid_fractional_factorial
